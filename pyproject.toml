[project]
name = "latentroom"
version = "0.1.0"
description = "Make and edit pictures with AI, on your PC."
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pywebview==6.2.1",
    "pillow==13.0.0",
    "nvidia-ml-py==13.615.71",
    "segno==1.6.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]
build = [
    "pyinstaller==6.22.3",
]

[tool.uv]
# An app, not a library: run from the repo, PyInstaller packages it. No wheel build.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
