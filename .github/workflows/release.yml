# On a v* tag: the tag must equal latentroom.__version__ and CHANGELOG.md must have notes for
# it, then the whole CI (tests, build, install test), then a DRAFT release with the installer
# and its .sha256. Nobody sees a draft until it is published by hand.
#
# Release steps:
# 1. The same X.Y.Z in latentroom/__init__.py and pyproject.toml, then `uv lock`; commit all 3.
# 2. CHANGELOG.md: "## [Unreleased]" becomes "## [X.Y.Z] - <date>"; add a new empty Unreleased.
# 3. Push, wait for a green CI, install its latentroom-setup artifact over the last version once.
# 4. `git tag vX.Y.Z` and `git push --tags`: this workflow makes the draft.
# 5. Releases > the draft: check the notes and both files, leave pre-release unticked (the update
#    check skips pre-releases), publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must equal latentroom.__version__
        run: |
          v=$(python3 -c "import latentroom; print(latentroom.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match latentroom.__version__ $v: use tag v$v"
            exit 1
          fi
      - name: CHANGELOG.md must have notes for this version  # never a release with empty notes
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > /dev/null

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml  # this repo at this tag's commit

  draft:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the draft release: the only write permission in CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: latentroom-setup
          path: dist
      - name: Draft release, notes from this version's part of CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          python3 scripts/release_notes.py "$v" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Latentroom $v" --notes-file notes.md
